version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: AIVideoPlatform
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - ai-video-network

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - ai-video-network

  rabbitmq:
    image: rabbitmq:3-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - ai-video-network

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - ai-video-network

  api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PROJECT: AIVideoPlatform.Api
    ports:
      - "8080:8080"
    depends_on:
      - postgres
      - redis
      - rabbitmq
      - minio
    networks:
      - ai-video-network

  worker-orchestrator:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PROJECT: AIVideoPlatform.Worker.Orchestrator
    depends_on:
      - rabbitmq
    networks:
      - ai-video-network

  worker-media:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PROJECT: AIVideoPlatform.Worker.Media
    depends_on:
      - rabbitmq
      - minio
    networks:
      - ai-video-network

  worker-ai:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PROJECT: AIVideoPlatform.Worker.AI
    depends_on:
      - rabbitmq
      - minio
    networks:
      - ai-video-network

  worker-publisher:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PROJECT: AIVideoPlatform.Worker.Publisher
    depends_on:
      - rabbitmq
      - minio
    networks:
      - ai-video-network

networks:
  ai-video-network:
    driver: bridge

volumes:
  postgres_data:
  minio_data:
